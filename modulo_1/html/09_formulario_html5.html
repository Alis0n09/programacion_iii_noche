<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>FORMULARIOS HTML5</title>
    </head>
    <body>
         <P>
            Formulario html5
         </p>

         <form action="proceso.php" method="post">
            <fieldset>
                <legend>Registro de Usuario</legend>
                <table>
                    <tr>
                        <td>
                            <label for="nombre">Nombre Completo</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">
                        </td>
                        <td>
                            <label for="correo">Correo Electrónico</label>
                            <input type="email" id="correo" name="correo" placeholder="Escribe tu correo">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="nacimiento">Fecha de Nacimiento</label>
                            <input type="date" id="fecha" name="fecha">
                        </td>
                        <td>
                            <label for="numero">Color favorito</label>
                            <input type="color" id="color" name="color">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="genero">Genero</label>
                            <input type="radio" id="m" name="genero" value="M"><label for="m">Masculino</label>
                            <input type="radio" id="f" name="genero" value="F"><label for="f">Femenino</label>
                        </td>
                        <td>
                            <label for="pais">Pais</label>
                            <select name="pais" id="pais">
                                <option value="ec">Ecuador</option>
                                <option value="mx">México</option>
                                <option value="ar">Argentina</option>
                                <option value="co">Colombia</option>
                                <option value="pe">Perú</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="comentario">Comentarios</label>
                            <textarea id="comentarios" name="comentarios" rows="4" cols="40"></textarea>
                            <br>
                        </td>
                        <td>
                            <input type="checkbox" id="acepto" name="acepto" required>
                            <label for="acepto">Acepto términos y condiciones</label>
                        </td>
                    </tr>
                </table>
                <input type="submit" value="Enviar">
                <input type="reset" value="Borrar">
            </fieldset>
         </form>
    </body>
</html>
