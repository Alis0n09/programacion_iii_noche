<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestor de Accesos - Alivida</title>
</head>
<body>

  <h1>Registro de Accesos - Urbanización Alivida</h1>

  <form id="formulario">
    <input type="text" id="direccion" placeholder="Nombre del Visitante o Residente" required>
    <input type="text" id="descripcion" placeholder="Motivo de Ingreso" required>
    <input type="number" id="precio" placeholder="Número del Vehículo (si aplica)" required>
    <button type="submit">Registrar Acceso</button>
  </form>

  <section id="contenedorCasas"></section>

  <script src="08_casas_mp.js"></script>
</body>
</html>
