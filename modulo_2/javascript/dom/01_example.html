<html>
    <head>
        <meta charset="UTF-8">
        <script src="01_example.js" defer></script>
        <title>DOM Example</title>
    </head>
    <body>
        <h1>Ejercicio Propina y Total personas</h1>
        <p>Ingresa el valor de la cuenta y elige el % de la propina</p>
        <input type="number" id="valor_cuenta" placeholder="Valor de la cuenta">
        <select id="propina">
            <option>10%</option>
            <option>15%</option>
            <option>20%</option>
        </select>
        <input type="number" id="personas" placeholder="Número de personas">
        <br>
        <button id="calcular">Calcular</button>
        <div id="resultado"></div>
</html>
